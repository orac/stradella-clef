name: Build and deploy site

# Deploys to GitHub Pages via the Actions source, so there is no gh-pages branch
# and no build output in the repository. Set Settings -> Pages -> Source to
# "GitHub Actions" once, or this workflow will build and then fail to deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Snippet.astro engraves the notation examples during the build. Ubuntu
      # 24.04 packages LilyPond 2.24.3, the oldest version the library supports.
      - run: sudo apt-get update && sudo apt-get install -y lilypond
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
